name: Pipeline
on:
  push: {branches: [main]}
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - use: actions/checkout@v4
      - run: test -s VERSION && echo "unit tests passed for  ${cat VERSION}"
    deploy-prod:
      if: github.event_name == 'push'
      needs: test
      runs-on: ubuntu-24.04
      steps:
        - uses: actions/checkout@v4
        - run: echo "deploying booking-api ${cat VERSION}"
        - run: bash smoke.sh